# Four blocking checks per language: vulnerability scan, dependency freshness,
# linter, and spelling. No opt-out, no skip list. A blocked commit names a root
# cause to fix, never a reason to bypass.
# Three gates, three responsibilities: a commit pays for what it changed, a push
# pays for the whole repository, a merge pays for integration.
default_install_hook_types: [pre-commit, pre-push, pre-merge-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-xml
        # A malformed props or targets file breaks every consumer of the package,
        # and the toolkit's own build would not have caught it before it imported
        # its own output.
        files: \.(props|targets|csproj|nuspec)$
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # -x follows sourced files: without it every script reports SC1091, and
        # _common.sh reports its own exports as unused.
        args: [-x]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        # -w writes: a formatter that only diffs never converges and fails forever.
        args: [-i, "2", -ci, -w]

  - repo: local
    hooks:
      - id: cspell
        name: spelling (cspell, language en)
        entry: cspell lint --no-progress --no-summary
        # node, not system: a system hook depends on whatever happens to be
        # installed, which is the opposite of a self-contained harness. It passed
        # locally and failed on a clean runner with "Executable `cspell` not found".
        language: node
        additional_dependencies: ['cspell@9.2.1']
        pass_filenames: true
        stages: [pre-commit]

      - id: dotnet-format
        name: C# formatting and analysers
        entry: bash -c 'dotnet format --verify-no-changes --verbosity minimal'
        language: system
        pass_filenames: false
        files: \.(cs|csproj|props|targets|sln)$
        stages: [pre-commit]

      # The four checks that used to be listed here, plus the two that were only
      # ever listed in the workflow, now come from one place: scripts/hooks/, where
      # each check declares its own stage. Two copies of one inventory drifted
      # within days, and the copy nobody read was the one in this file.
      # Invoked through bash, not directly: a generated repository's scripts arrive
      # without the executable bit, and the check that says so must be able to run.
      # Otherwise the first commit of every new repository fails on "permission
      # denied" instead of on a named fix.
      - id: repository-checks
        name: repository checks (fast, offline)
        entry: bash scripts/checks.sh --stage pre-commit
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # The inner loop: only the test projects the staged change can reach. Running
      # the whole suite on every commit is how a developer learns to stop committing.
      - id: tests-affected
        name: tests reachable from the staged change
        entry: bash scripts/test.sh --staged
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: repository-checks-slow
        name: repository checks (slow, or network)
        entry: bash scripts/checks.sh --stage pre-push
        language: system
        pass_filenames: false
        stages: [pre-push]

      # The branch is leaving the machine: everything, whatever changed.
      - id: tests-all
        name: the whole unit suite
        entry: bash scripts/test.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: repository-checks-merge
        name: repository checks (integration)
        entry: bash scripts/checks.sh --stage pre-merge
        language: system
        pass_filenames: false
        stages: [pre-merge-commit]

      # Two histories are becoming one: the figure that matters is the one measured on
      # the result, not on either side.
      - id: coverage
        name: coverage of the unit suite
        entry: bash scripts/coverage.sh
        language: system
        pass_filenames: false
        stages: [pre-merge-commit]
