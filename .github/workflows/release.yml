name: release

# A release is a tag. We push a signed, annotated tag on a commit of `master` when we
# are certain; this workflow does the rest. No bot writes a version, a changelog or a
# commit: the tag is the version, MinVer reads it, and the release notes are
# GitHub's, generated from the pull requests between two tags.
#
# Publication is keyless. The workflow asks GitHub for a short-lived OIDC token,
# nuget.org validates it against a trusted publishing policy naming this repository
# and this file, and hands back an API key valid for one hour. Nothing long-lived is
# stored, in this repository or in any of its siblings: a key copied into nineteen
# repositories is nineteen copies of the same credential to rotate, and one of them
# will be forgotten.
#
# The policy is registered once per repository on nuget.org, under Trusted Publishing:
#   Repository Owner: Rinzler78 · Repository: <this repository> · Workflow: release.yml
#   Environment: release — restricted, in the repository settings, to tags `v*`

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A nuget.org policy matches the owner, the repository, the workflow *file name*
    # and the environment — never the ref. Without an environment, any ref carrying a
    # file named release.yml could mint a key. The `release` environment only admits
    # deployments from tags `v*`, and tags `v*` can be neither moved nor deleted.
    environment: release
    permissions:
      # The token is exchanged with nuget.org; contents: write creates the GitHub
      # release, after the packages are pushed.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer reads the version from the tags, and the tag check needs master.
          fetch-depth: 0

      # Every refusal is cheaper before the build than after the push: the form of the
      # name, the annotation, the signature GitHub verifies, and that master contains
      # the commit.
      - name: Tag check
        id: tag
        run: ./scripts/_release-tag.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: jdx/mise-action@v2
      - run: pipx install pre-commit

      # Nothing costly is discovered at release time — the pull request into master
      # ran it — but nothing is published from a tree that was never verified either.
      - name: Restore, locked
        run: dotnet restore --locked-mode

      - name: Build
        run: ./scripts/build.sh
        env:
          CONFIGURATION: Release

      - name: Test
        run: ./scripts/test.sh
        env:
          CONFIGURATION: Release

      - name: Repository checks
        run: ./scripts/checks.sh --stage all

      - name: Package
        run: ./scripts/package.sh

      # The token is exchanged immediately before the push: the key it returns lives
      # one hour, and a key requested at the top of a job that then builds for fifty
      # minutes is a key that expires between the pack and the push.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: Rinzler78

      - name: Publish
        run: ./scripts/publish.sh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          # The version the tag names. publish.sh refuses a package that does not carry
          # it: a version pushed to nuget.org cannot be replaced, so the agreement
          # between the tag and the artefacts MinVer versioned is checked before the
          # push rather than discovered after it.
          EXPECTED_VERSION: ${{ steps.tag.outputs.version }}

      - name: GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          ${{ steps.tag.outputs.prerelease == 'true' && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
