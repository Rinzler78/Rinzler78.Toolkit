name: release

# Publication is keyless. The workflow asks GitHub for a short-lived OIDC token,
# nuget.org validates it against a trusted publishing policy naming this repository
# and this file, and hands back an API key valid for one hour. Nothing long-lived is
# stored, in this repository or in any of its siblings: a key copied into nineteen
# repositories is nineteen copies of the same credential to rotate, and one of them
# will be forgotten.
#
# The policy is registered once per repository on nuget.org, under Trusted Publishing:
#   Repository Owner: Rinzler78 · Repository: <this repository> · Workflow: release.yml
#
# Release Please owns the version. It is computed from Conventional Commits, never
# edited by hand, and there is no second versioning mechanism.

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      # The tag carries a leading `v`; the packages do not. Two outputs rather than one
      # string sliced at the point of use.
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # The branch releases are cut from, stated rather than inferred. Release Please
          # defaults to the repository's *default* branch — `develop` here — not to the
          # branch that triggered the run, so the first run built a release branch off
          # `develop` while this workflow only ever triggers on `master`.
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      # The only permission publication needs: the token is exchanged with nuget.org,
      # and nothing in this job may write to the repository.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: jdx/mise-action@v2
      - run: pipx install pre-commit

      # Nothing costly is discovered at release time — but nothing is published from a
      # tree that was never verified either.
      - name: Restore, locked
        run: dotnet restore --locked-mode

      - name: Build
        run: ./scripts/build.sh
        env:
          CONFIGURATION: Release

      - name: Test
        run: ./scripts/test.sh
        env:
          CONFIGURATION: Release

      - name: Repository checks
        run: ./scripts/checks.sh --stage all

      - name: Package
        run: ./scripts/package.sh

      # The token is exchanged immediately before the push: the key it returns lives
      # one hour, and a key requested at the top of a job that then builds for fifty
      # minutes is a key that expires between the pack and the push.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: Rinzler78

      - name: Publish
        run: ./scripts/publish.sh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          # The tag the release created, without its `v`. publish.sh refuses to push a
          # package that does not carry it: a version pushed to nuget.org cannot be
          # replaced, so the agreement between the tag, version.txt and the artefacts is
          # checked before the push rather than discovered after it.
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
