name: promotion

# master receives promotions from develop and nothing else, and no ruleset can
# restrict a pull request's source branch. This check does, and it has to run from a
# copy of the workflow the pull request cannot edit: pull_request_target runs the
# definition held by the base branch, master, and this job checks out no code from
# the pull request at all. A step in ci.yml, which runs from the pull request's own
# merge commit, could be removed by the very pull request it judges.

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  promotion-source:
    runs-on: ubuntu-latest
    steps:
      - name: Promotion comes from this repository's develop
        env:
          # The repository as well as the branch: a fork's branch may be named develop.
          SOURCE: ${{ github.event.pull_request.head.repo.full_name }}:${{ github.event.pull_request.head.ref }}
          EXPECTED: ${{ github.repository }}:develop
        run: |
          [[ "$SOURCE" == "$EXPECTED" ]] ||
            { echo "::error::only $EXPECTED is promoted into master; this pull request comes from $SOURCE"; exit 1; }
