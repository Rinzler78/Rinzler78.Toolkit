# Four blocking checks per language: vulnerability scan, dependency freshness,
# linter, and spelling. No opt-out, no skip list. A blocked commit names a root
# cause to fix, never a reason to bypass.
default_install_hook_types: [pre-commit, pre-push]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-xml
        # A malformed props or targets file breaks every consumer of the package,
        # and the toolkit's own build would not have caught it before it imported
        # its own output.
        files: \.(props|targets|csproj|nuspec)$
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # -x follows sourced files: without it every script reports SC1091, and
        # _common.sh reports its own exports as unused.
        args: [-x]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        # -w writes: a formatter that only diffs never converges and fails forever.
        args: [-i, "2", -ci, -w]

  - repo: local
    hooks:
      - id: cspell
        name: spelling (cspell, language en)
        entry: cspell lint --no-progress --no-summary
        # node, not system: a system hook depends on whatever happens to be
        # installed, which is the opposite of a self-contained harness. It passed
        # locally and failed on a clean runner with "Executable `cspell` not found".
        language: node
        additional_dependencies: ['cspell@9.2.1']
        pass_filenames: true
        stages: [pre-commit]

      - id: dotnet-format
        name: C# formatting and analysers
        entry: bash -c 'dotnet format --verify-no-changes --verbosity minimal'
        language: system
        pass_filenames: false
        files: \.(cs|csproj|props|targets|sln)$
        stages: [pre-commit]

      # The four checks that used to be listed here, plus the two that were only
      # ever listed in the workflow, now come from one place: scripts/hooks/, where
      # each check declares its own stage. Two copies of one inventory drifted
      # within days, and the copy nobody read was the one in this file.
      - id: repository-checks
        name: repository checks (fast, offline)
        entry: scripts/checks.sh --stage pre-commit
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: repository-checks-slow
        name: repository checks (slow, or network)
        entry: scripts/checks.sh --stage pre-push
        language: system
        pass_filenames: false
        stages: [pre-push]
