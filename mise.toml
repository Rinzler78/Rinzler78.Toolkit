# Declared toolchain. `mise install` converges the machine; `scripts/setup-env.sh
# --check` reports without mutating.
[tools]
dotnet = "10.0.100"
node = "22"
python = "3.12"

[env]
# Neutralise any newer SDK preview installed system-wide: global.json pins the
# band, this makes the intent explicit to anyone reading the toolchain.
DOTNET_ROLL_FORWARD = "latestFeature"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"
